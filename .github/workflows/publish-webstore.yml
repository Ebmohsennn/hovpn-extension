name: Publish to Chrome Web Store

# Publishes the extension automatically when its version changes on main
# (bump extension/manifest.json → push → it uploads + submits for review),
# or on demand via the "Run workflow" button.
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-webstore
  cancel-in-progress: false

env:
  ITEM_ID: ifcbhfjmblebbinhgjhfmjgnkmoneifg   # Hovpn's Web Store item id (public)
  # Exact version on purpose: this tool is handed the publishing credentials.
  # Review the changelog before raising it.
  CWS_CLI: chrome-webstore-upload-cli@3.5.0

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # need the pre-push commit to detect a version change
          persist-credentials: false

      - name: Decide whether to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          NEW=$(node -p "require('./extension/manifest.json').version")
          # Compare with the commit main pointed at before this push, so a
          # version bump anywhere in a multi-commit push is seen.
          OLD=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:extension/manifest.json" 2>/dev/null; then
            OLD=$(git show "$BEFORE:extension/manifest.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          fi
          echo "current=$NEW previous=$OLD event=$EVENT_NAME"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$NEW" != "$OLD" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::extension version unchanged ($NEW) — skipping publish"
          fi

      - name: Verify secrets are configured
        if: steps.gate.outputs.go == 'true'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ] && missing="$missing CWS_CLIENT_ID"
          [ -z "$CLIENT_SECRET" ] && missing="$missing CWS_CLIENT_SECRET"
          [ -z "$REFRESH_TOKEN" ] && missing="$missing CWS_REFRESH_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — see WEBSTORE-PUBLISH.md"
            exit 1
          fi

      - name: Build store zip (strip key)
        if: steps.gate.outputs.go == 'true'
        run: |
          rm -rf build hovpn-store.zip
          cp -r extension build
          node -e "const fs=require('fs'),p='build/manifest.json',m=JSON.parse(fs.readFileSync(p));delete m.key;fs.writeFileSync(p,JSON.stringify(m,null,2))"
          find build -name '.DS_Store' -delete
          ( cd build && zip -rq ../hovpn-store.zip . )
          echo "built hovpn-store.zip ($(node -p "require('./extension/manifest.json').version"))"

      # The credentials reach the CLI through the environment (it reads
      # EXTENSION_ID, CLIENT_ID, CLIENT_SECRET and REFRESH_TOKEN), never through
      # the command line or the script text.
      - name: Upload + publish to Chrome Web Store
        if: steps.gate.outputs.go == 'true'
        env:
          EXTENSION_ID: ${{ env.ITEM_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes "$CWS_CLI" upload --source hovpn-store.zip
          npx --yes "$CWS_CLI" publish
          echo "::notice::Uploaded + submitted for review. It goes live after Google's review passes."
