<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hovpn</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" id="brandDot"></span>
      <span class="brand-name">Ho<span class="brand-thin">vpn</span></span>
    </div>
    <button id="optionsBtn" class="icon-btn" type="button" title="Options" aria-label="Options">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <section id="hero" class="hero state-off">
    <div class="hero-aura"></div>
    <button id="powerBtn" class="orb" type="button" aria-label="Connect">
      <span class="orb-ring"></span>
      <span class="orb-ring orb-ring-2"></span>
      <span class="orb-face">
        <span id="orbIcon" class="orb-icon"></span>
      </span>
    </button>
    <div class="hero-text">
      <div id="heroStatus" class="hero-status">Not connected</div>
      <div id="heroSub" class="hero-sub">Tap the button to connect</div>
    </div>
    <div id="connDetail" class="conn-detail hidden">
      <span id="connProto" class="chip"></span>
      <span id="connSignal" class="signal-slot"></span>
      <span id="connTimer" class="timer">0:00</span>
    </div>
  </section>

  <div id="error" class="error-banner" role="alert"></div>

  <section id="listSection" class="list-section">
    <div id="listControls" class="controls hidden">
      <div class="search-wrap">
        <svg class="search-ico" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input id="search" type="search" placeholder="Search servers" autocomplete="off" />
      </div>
      <select id="sortBy" title="Sort by">
        <option value="favorite">★ Favorites</option>
        <option value="latency">⚡ Fastest</option>
        <option value="name">A–Z Name</option>
      </select>
      <button id="refreshLatency" class="icon-btn" type="button" title="Test latency">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6" /><path d="M1 20v-6h6" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
      </button>
    </div>
    <div id="profileList" class="list"></div>
  </section>

  <footer class="footer">
    <div class="seg">
      <button id="addToggle" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Server
      </button>
      <button id="subToggle" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
        Subscription
      </button>
    </div>

    <div id="addForm" class="panel hidden">
      <div id="addHead" class="panel-head hidden"><span>Edit server</span><button class="cancel-edit" id="addCancel" type="button">Cancel</button></div>
      <input id="newName" type="text" placeholder="Name (optional)" />
      <textarea id="newLink" placeholder="vmess:// · vless:// · trojan:// · ss://"></textarea>
      <button id="saveProfile" class="btn-primary" type="button">Save server</button>
    </div>

    <div id="subForm" class="panel hidden">
      <div id="subHead" class="panel-head hidden"><span>Edit subscription</span><button class="cancel-edit" id="subCancel" type="button">Cancel</button></div>
      <input id="subLabel" type="text" placeholder="Label (optional)" />
      <input id="subUrl" type="text" placeholder="https://provider.com/sub/…" />
      <button id="fetchSub" class="btn-primary" type="button">Fetch &amp; import</button>
    </div>

    <div class="brandbar">
      <a class="brandbar-link" href="https://hovpn.vip" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        hovpn.vip
      </a>
      <span class="brandbar-sep">·</span>
      <a class="brandbar-link" id="repoLink" href="https://github.com/Ebmohsennn/hovpn-extension" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.85 9.73.5.1.68-.22.68-.49 0-.24-.01-.87-.01-1.71-2.79.62-3.38-1.38-3.38-1.38-.46-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.56 2.36 1.11 2.94.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.74-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.71 1.03 1.62 1.03 2.74 0 3.92-2.34 4.78-4.57 5.04.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
        GitHub
      </a>
      <span class="brandbar-spacer"></span>
      <span class="brandbar-ver" id="appVersion"></span>
    </div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
